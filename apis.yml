name: Plenna
description: >-
  Plenna is a women's healthcare provider operating a network of integrated
  medical clinics across Mexico City, redefining health for women across every
  life stage. Its services span gynecology, maternity and prenatal care,
  fertility, menopause, contraception, gynecological surgery, psychology,
  nutrition, laboratory studies, vaccines and lactation support, delivered
  across six physical clinics (Tlalpan, Coapa, Del Valle, Polanco, San Angel
  and Satelite) and through Portal Plenna, a patient portal and iOS/Android
  mobile app for scheduling appointments, virtual consultations, test results,
  prescriptions and pregnancy tracking. Plenna is a 500 Global portfolio
  company. It is surfaced in the API Evangelist network as a company profile;
  no public developer API surface was found during enrichment.
